[package]
name = "vtee"
version = "0.0.1"
edition = "2024"
description = "A tee for terminal programs: watch, share, drive and test any TUI's screen."
repository = "https://github.com/huntwj/vtee"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["terminal", "pty", "tmux", "testing", "ai"]
categories = ["command-line-utilities", "development-tools::testing"]
rust-version = "1.89"
exclude = [
    ".github/**",
    "docker/**",
    "HANDOFF.md",
    "release-plz.toml",
    "tests/differential/oracle/**",
]

[dependencies]
alacritty_terminal = "0.26.0"
clap = { version = "4.6.7", features = ["derive"] }
clap-verbosity-flag = "3.0.4"
confy = "2.0.0"
crossterm = "0.29.0"
env_logger = "0.11.11"
exitcode = "1.1.2"
human-panic = "2.0.8"
libc = "0.2.190"
log = "0.4.34"
owo-colors = { version = "4.4.0", features = ["supports-colors"] }
portable-pty = "0.9.0"
regex = "1.13"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
signal-hook = "0.4.5"
vte = { version = "0.15.0", features = ["ansi"] }

[target.'cfg(windows)'.dependencies]
uds_windows = "1.2"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
