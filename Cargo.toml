[package]
name = "vtee"
version = "0.0.0"
edition = "2024"
description = "A terminal multiplexer for AI and testing: tee for a TUI, with queryable terminal state."
publish = false

[dependencies]
alacritty_terminal = "0.26.0"
crossterm = "0.29.0"
portable-pty = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
signal-hook = "0.4.5"
vte = { version = "0.15.0", features = ["ansi"] }
