[package]
name = "vtee"
version = "0.0.0"
edition = "2024"
description = "A terminal multiplexer for AI and testing: tee for a TUI, with queryable terminal state."
publish = false

[dependencies]
alacritty_terminal = "0.26.0"
clap = { version = "4.6.7", features = ["derive"] }
clap-verbosity-flag = "3.0.4"
confy = "2.0.0"
crossterm = "0.29.0"
env_logger = "0.11.11"
exitcode = "1.1.2"
human-panic = "2.0.8"
libc = "0.2.190"
log = "0.4.34"
owo-colors = { version = "4.4.0", features = ["supports-colors"] }
portable-pty = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
signal-hook = "0.4.5"
vte = { version = "0.15.0", features = ["ansi"] }

[target.'cfg(windows)'.dependencies]
# AllocConsole, called defensively before creating a pty (src/lib.rs, docs/decisions.md) -
# measured to matter, not a precaution added on spec: pty creation itself was observed to hang
# when the calling process had no console of its own, independent of anything vtee does.
winapi = { version = "0.3.9", features = ["consoleapi"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"

# Local one-line fix for the Windows ConPTY bug (docs/decisions.md, vendor/portable-pty/
# README-vtee-patch.md) - CREATE_NEW_PROCESS_GROUP missing from CreateProcessW, tracked
# upstream at wezterm/wezterm#7025. Remove this and the vendor/ directory once a released
# portable-pty actually fixes it.
[patch.crates-io]
portable-pty = { path = "vendor/portable-pty" }
