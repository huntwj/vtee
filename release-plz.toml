# Versions, changelog, tags and GitHub Releases are all computed from Conventional Commits on `main`.
# How it works and the one-time repo setup: docs/releasing.md.

[workspace]
# release-plz never runs `cargo publish` for now: releases are a git tag + GitHub Release, and crates.io uploads
# are manual (docs/releasing.md, "Publishing to crates.io").
publish = false
# Versions are read from git tags (`vX.Y.Z`) instead of from the crates.io index.
git_only = true
git_tag_enable = true
git_release_enable = true
# cargo-semver-checks needs a published baseline to compare against.
semver_check = false
# Only release when a release PR was merged, not on every push to main.
release_always = false
changelog_update = true
pr_labels = ["release"]
# While the version is 0.x: `feat` bumps the minor version (release-plz's default would bump only the patch)
# and a breaking change also bumps the minor version. From 1.0 on: feat -> minor, breaking -> major.
features_always_increment_minor = true
# Only these commits cause a release: feat, fix, perf, and anything marked breaking with `!`.
# docs/test/chore/ci/style/refactor/build alone never trigger one.
release_commits = '^(feat|fix|perf)(\(.+\))?!?:|^[a-z]+(\(.+\))?!:'

[changelog]
protect_breaking_commits = true
commit_parsers = [
  # Output-affecting changes first, so they are grouped together whatever their type (docs/guide/versioning.md).
  { message = '^(feat|fix|perf|refactor)\(snapshot\)', group = "Snapshot output changes" },
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Changed" },
  { message = "^(docs|test|chore|ci|style|build)", skip = true },
]
